data:
  train_lmdb_dir: '/disk6/yxdong/Dcase2023/synth_real_data/combine_synth_real/lmdb_foa_dev_data_label_len10s'
  test_lmdb_dir: '/disk6/yxdong/Dcase2023/synth_real_data/combine_synth_real/lmdb_test_foa_dev_data_label_len10s'
  ref_files_dir: 'dataset/metadata_dev_test'
  norm_file: 'dataset/24h_ACS_foa_wts'
  segment_len: 100
  batch_size: 32
  train_ignore: 'enh' # No ACS
  test_ignore: 'enh'

model:
  type: 'Dualmode_seddoa_nopool_APC'
  in_channel: 7
  in_dim: 64
  out_dim: 39
  att_context_size: [100,49]
  num_conformer_layer: 8
  encoder_dim: 256
  hpc_future_steps: 10
  hpc_negative_samples: 32
  pre-train: False
  pre-train_model: '...'

train:
  train_num_workers: 8
  test_num_workers: 4
  lr: 0.001
  nb_steps: 60000
  early_stop_patience: 40
  stream_weight: 1.0
  nonstream_weight: 1.0
  distill_weight: 0.1
  hpc_weight: 0.1

result:
  log_output_path: 'results/Dual_Cache_APC_RC_24h_Chunk[100,49]_8ConformerLayer_3/train.log'
  log_interval: 100
  checkpoint_output_dir: 'results/Dual_Cache_APC_RC_24h_Chunk[100,49]_8ConformerLayer_3/checkpoints'
  dcase_output_dir: 'results/Dual_Cache_APC_RC_24h_Chunk[100,49]_8ConformerLayer_3/results'


