data:
  wav_folder_path: 'dataset/foa_dev_test'
  ref_files_dir: 'dataset/metadata_dev_test'
  norm_file: 'dataset/24h_ACS_foa_wts'
  segment_len: 30
  batch_size: 1
  train_ignore: 'enh' # No ACS
  test_ignore: 'enh'

model:
  type: 'seddoa_nopool'
  in_channel: 7
  in_dim: 64
  out_dim: 39
  att_context_size: [100,49]
  num_conformer_layer: 8
  encoder_dim: 256
  pre-train: True
  pre-train_model: 'results/Cache_RC_24h_Chunk[100,49]_8ConformerLayer_3s/checkpoints/checkpoint_epoch169_step153283.pth'

result:
  log_output_path: 'results/Test_Streamingly_Cache_RC_24h_Chunk[100,49]_8ConformerLayer_3s/train.log'
  log_interval: 100
  dcase_output_dir: 'results/Test_Streamingly_Cache_RC_24h_Chunk[100,49]_8ConformerLayer_3s/results'


