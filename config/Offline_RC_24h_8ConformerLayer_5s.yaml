data:
  train_lmdb_dir: '/disk6/yxdong/Dcase2023/synth_real_data/combine_synth_real/lmdb_foa_dev_data_label_len5s'
  test_lmdb_dir: '/disk6/yxdong/Dcase2023/synth_real_data/combine_synth_real/lmdb_foa_dev_data_label_len5s'
  ref_files_dir: 'dataset/metadata_dev_test'
  norm_file: 'dataset/24h_ACS_foa_wts'
  segment_len: 50
  batch_size: 32
  train_ignore: 'enh' # No ACS
  test_ignore: 'enh'

model:
  type: 'seddoa_nopool'
  in_channel: 7
  in_dim: 64
  out_dim: 39
  # att_context_size: [50,0]
  num_conformer_layer: 8
  pre-train: False
  pre-train_model: '...'

train:
  train_num_workers: 8
  test_num_workers: 4
  lr: 0.001
  nb_steps: 120000
  early_stop_patience: 40

result:
  log_output_path: 'results/Offline_RC_24h_8ConformerLayer_5s/train.log'
  log_interval: 100
  checkpoint_output_dir: 'results/Offline_RC_24h_8ConformerLayer_5s/checkpoints'
  dcase_output_dir: 'results/Offline_RC_24h_8ConformerLayer_5s/results'


